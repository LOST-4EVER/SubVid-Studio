name: Build and Release SubVid Studio APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Custom Release Title (optional)'
        required: false
        default: ''
      release_notes:
        description: 'Custom Release Notes / Changelog'
        required: false
        default: ''

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Environment Files Exist
        run: |
          touch .env.example
          touch .env

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

  build:
    name: Build & Publish Advanced Release
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Signing Keystores and Env
        run: |
          touch .env.example
          touch .env

          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, OU=Android, O=Google, L=Mountain View, S=CA, C=US"
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "Generating automated release signing keystore..."
            keytool -genkey -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SubVidStudio, OU=Android, O=SubVid, L=San Francisco, S=CA, C=US"
          fi

      - name: Compute Dynamic Version & Unique Release Metadata
        id: meta
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date +'%Y.%m.%d')"
          BUILD_TIMESTAMP="$(date +'%Y-%m-%d %H:%M:%S UTC')"
          TAG_TIMESTAMP="$(date +'%Y%m%d-%H%M%S')"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            CLEAN_VERSION="${RAW_TAG#v}"
            RELEASE_TAG="${RAW_TAG}"
            RELEASE_NAME="SubVid Studio ${RAW_TAG}"
          else
            CLEAN_VERSION="1.2.${BUILD_NUM}"
            RELEASE_TAG="v1.2.${BUILD_NUM}-${TAG_TIMESTAMP}"
            
            CUSTOM_TITLE="${{ github.event.inputs.release_title }}"
            if [ -n "$CUSTOM_TITLE" ]; then
              RELEASE_NAME="SubVid Studio - ${CUSTOM_TITLE} (v${CLEAN_VERSION})"
            else
              RELEASE_NAME="SubVid Studio v${CLEAN_VERSION} (${BUILD_DATE})"
            fi
          fi

          echo "Injecting VersionName: ${CLEAN_VERSION} and VersionCode: ${BUILD_NUM} into app/build.gradle.kts"
          sed -i 's/versionName = ".*"/versionName = "'"${CLEAN_VERSION}"'"/' app/build.gradle.kts
          sed -i 's/versionCode = .*/versionCode = '"${BUILD_NUM}"'/' app/build.gradle.kts

          echo "clean_version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'releasekey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Package & Generate Checksums
        id: pkg
        run: |
          mkdir -p dist
          
          # Copy & Rename Release and Debug APKs
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/SubVidStudio-v${{ steps.meta.outputs.clean_version }}-release.apk
            cp app/build/outputs/apk/release/app-release.apk dist/SubVidStudio-release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/SubVidStudio-v${{ steps.meta.outputs.clean_version }}-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk dist/SubVidStudio-debug.apk
          fi

          # Compute SHA-256 Checksums
          cd dist
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt
          cd ..

      - name: Upload Workflow Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subvid-studio-v${{ steps.meta.outputs.clean_version }}-build-${{ github.run_number }}
          path: dist/*
          retention-days: 30

      - name: Create Independent GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            # 🎬 ${{ steps.meta.outputs.release_name }}

            **Build Date:** `${{ steps.meta.outputs.build_timestamp }}`  
            **Commit Hash:** `${{ steps.meta.outputs.short_sha }}`  
            **Version Code:** `${{ github.run_number }}` | **Version Name:** `v${{ steps.meta.outputs.clean_version }}`

            ---

            ### 📦 Download Assets
            | Asset | Description |
            |---|---|
            | **`SubVidStudio-release.apk`** | Production Signed & Minified Release Build |
            | **`SubVidStudio-debug.apk`** | Debug Build with Comprehensive Logging |
            | **`sha256_checksums.txt`** | Cryptographic verification checksums for all binaries |

            ---

            ### ✨ Key Features & Capabilities
            - 🎞️ **Real-Time Video Subtitle Synchronizer**: Seamless frame-accurate seeking with gesture drag & drop positioning.
            - 🔍 **Find & Replace Engine**: Rapid regex and case-sensitive batch text replacement across all cues.
            - 🧹 **Timing Sanitizer**: One-tap repair for overlapping timestamps, negative durations, and chronological order.
            - 🎨 **Style Presets & Typography**: Built-in Cinema Classic, TikTok / Reels Pop, Neon Cyberpunk, Minimalist & Boxed presets.
            - 🚀 **Hardware Accelerated Processing**: Android `MediaCodec` + `MediaMuxer` pipeline with lossy hardcoding and lossless soft-muxing.
            - ⚡ **Batch Processing Hub**: Multi-threaded subtitle format conversion (SRT, WebVTT, ASS/SSA) and timing offsets.
            - 📱 **Adaptive Material 3 Design**: Optimized for portrait, landscape, tablets, and foldable devices.

            ---

            ### 🔒 SHA-256 Checksums
            Verify your downloads using the checksums recorded in `sha256_checksums.txt`.
          files: |
            dist/SubVidStudio-v${{ steps.meta.outputs.clean_version }}-release.apk
            dist/SubVidStudio-release.apk
            dist/SubVidStudio-v${{ steps.meta.outputs.clean_version }}-debug.apk
            dist/SubVidStudio-debug.apk
            dist/sha256_checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
