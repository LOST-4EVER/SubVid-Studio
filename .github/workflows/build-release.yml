name: Build and Release SubVid Studio APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Environment Files Exist
        run: |
          touch .env.example
          touch .env

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

  build:
    name: Build & Publish Release
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure Environment and Keystores Exist
        run: |
          touch .env.example
          touch .env

          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, OU=Android, O=Google, L=Mountain View, S=CA, C=US"
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "Generating automated release signing keystore..."
            keytool -genkey -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SubVidStudio, OU=Android, O=SubVid, L=City, S=State, C=US"
          fi

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'releasekey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p release_apks
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/SubVidStudio-debug.apk
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk release_apks/SubVidStudio-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_apks/SubVidStudio-release.apk
          fi
          ls -la release_apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subvid-studio-apks
          path: release_apks/*

      - name: Generate Dynamic Release Tag & Name
        id: release_info
        run: |
          BUILD_NUM="${{ github.run_number }}"
          SHORT_SHA="$(echo ${{ github.sha }} | cut -c1-7)"
          TIMESTAMP="$(date +'%Y-%m-%d %H:%M UTC')"
          TAG_DATE="$(date +'%Y%m%d-%H%M%S')"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="SubVid Studio ${TAG_NAME}"
          else
            TAG_NAME="v1.1.0-build.${BUILD_NUM}-${TAG_DATE}"
            RELEASE_NAME="SubVid Studio v1.1.0 (Build #${BUILD_NUM} • ${TIMESTAMP})"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_info.outputs.release_name }}
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## ${{ steps.release_info.outputs.release_name }}

            This automated release delivers the latest high-performance build of **SubVid Studio**:
            - 📦 **SubVidStudio-release.apk** (Signed Release Build, R8 Minified & Resource Optimized)
            - 🛠️ **SubVidStudio-debug.apk** (Debug Build with Logcat Instrumentation)

            ### Key Highlights & Features:
            - 📺 **Fullscreen Live Video Playback & Editing**: Seamless full-screen mode with interactive subtitle positioning and gesture controls.
            - ⚡ **Multi-track Canvas Timeline**: Hardware-accelerated 60 FPS scrubber with millisecond precision and micro-nudging (±0.1s / ±0.5s).
            - 🔤 **Universal Subtitle Formats**: Complete parsing and export for SRT, WebVTT, and ASS/SSA with custom styles, tags, and position preservation.
            - 🚀 **Hardware Video Acceleration**: Android MediaCodec & MediaMuxer encoder for lossless soft-muxing and high-bitrate hardcoded subtitle burn-in.
            - 🧩 **CPU/GPU Batch Processing Hub**: Multi-threaded bulk format conversion, time shifting, and video encoding.
            - 📱 **Universal Android Compatibility**: Optimized for Android 16 (API 36) down to Android 7.0 (API 24) across phones, foldables, and tablets.
          files: |
            release_apks/SubVidStudio-release.apk
            release_apks/SubVidStudio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}