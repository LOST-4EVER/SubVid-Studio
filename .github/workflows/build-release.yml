name: Build and Release SubVid Studio APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Environment Files Exist
        run: |
          touch .env.example
          touch .env

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

  build:
    name: Build & Publish Release
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Environment and Keystores Exist
        run: |
          touch .env.example
          touch .env

          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, OU=Android, O=Google, L=Mountain View, S=CA, C=US"
          fi

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "Generating automated release signing keystore..."
            keytool -genkey -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SubVidStudio, OU=Android, O=SubVid, L=City, S=State, C=US"
          fi

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'releasekey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p release_apks
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_apks/SubVidStudio-debug.apk
          fi
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk release_apks/SubVidStudio-release.apk
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release_apks/SubVidStudio-release.apk
          fi
          ls -la release_apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subvid-studio-apks
          path: release_apks/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: SubVid Studio ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## SubVid Studio Automated Release

            This release contains the latest automated builds of SubVid Studio:
            - **SubVidStudio-release.apk** (Signed Release Build)
            - **SubVidStudio-debug.apk** (Debug Build with Logging)

            ### Included Capabilities:
            - Multitrack Canvas timeline scrubbing
            - Interactive drag-and-drop subtitle positioning
            - SRT, VTT, and ASS/SSA subtitle parsing and export
            - Hardware-accelerated MediaCodec video export and soft-muxing
            - Multi-threaded CPU/GPU batch processing hub
          files: |
            release_apks/SubVidStudio-release.apk
            release_apks/SubVidStudio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}