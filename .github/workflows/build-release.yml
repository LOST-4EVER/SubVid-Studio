name: Build and Release SubVid Studio APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Use JDK 17 (pre-installed on runner)
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle 9.3.1 with dependency caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Decode or Generate Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "Generating automated release signing keystore..."
            keytool -genkey -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SubVidStudio, OU=Android, O=SubVid, L=City, S=State, C=US"
          fi

      - name: Build Debug and Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'releasekey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Organize APK Artifacts
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk release_apks/SubVidStudio-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release_apks/SubVidStudio-release.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: subvid-studio-apks
          path: release_apks/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: SubVid Studio Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          body: |
            ## SubVid Studio Automated Release

            This release contains the latest automated builds of SubVid Studio:
            - **SubVidStudio-release.apk** (Signed Release Build)
            - **SubVidStudio-debug.apk** (Debug Build with Logging)

            ### Included Capabilities:
            - Multitrack Canvas timeline scrubbing
            - Interactive drag-and-drop subtitle positioning
            - SRT, VTT, and ASS/SSA subtitle parsing and export
            - Hardware-accelerated MediaCodec video export and soft-muxing
            - Multi-threaded CPU/GPU batch processing hub
          files: |
            release_apks/SubVidStudio-release.apk
            release_apks/SubVidStudio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}